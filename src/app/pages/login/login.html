<section class="auth-page">
  <h1>Iniciar sesión</h1>

  <form (submit)="$event.preventDefault(); onSubmit()">
    <label>
      Correo
      <input type="email" [value]="correo()" (input)="correo.set($any($event.target).value)" required autocomplete="email" />
    </label>

    <label>
      Clave
      <input type="password" [value]="clave()" (input)="clave.set($any($event.target).value)" required autocomplete="current-password" />
    </label>

    @if (error()) {
      <p class="auth-page__error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Iniciando sesión...' : 'Iniciar sesión' }}
    </button>
  </form>

  <p>¿No tienes cuenta? <a routerLink="/registro">Crear una cuenta</a></p>
</section>
