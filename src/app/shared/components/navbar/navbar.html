<header class="navbar">
  <div class="container navbar__inner">
    <a routerLink="/" class="navbar__brand">MotoCompare</a>

    <nav class="navbar__links">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="is-active" class="navbar__link">{{ link.label }}</a>
      }
    </nav>

    @if (authService.usuario(); as usuario) {
      <span class="navbar__session">
        <a routerLink="/perfil" class="navbar__login">{{ usuario.nombre }}</a>
        <button type="button" class="navbar__logout" (click)="onLogout()">Cerrar sesión</button>
      </span>
    } @else {
      <a routerLink="/login" class="navbar__login">Iniciar sesión</a>
    }
  </div>
</header>
